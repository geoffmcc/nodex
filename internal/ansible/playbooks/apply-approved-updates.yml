---
- name: Apply approved full updates
  hosts: all
  gather_facts: true
  become: true
  tasks:
    - name: Verify Debian family
      ansible.builtin.assert:
        that: ansible_facts['os_family'] == 'Debian'
    - name: Refresh package metadata
      ansible.builtin.apt:
        update_cache: true
    - name: Install approved full updates
      ansible.builtin.apt:
        upgrade: dist
        state: latest
      register: nodex_update_result
    - name: Report update result
      ansible.builtin.debug:
        msg: "full update operation completed"
