---
# Nodex embedded playbook: check-updates (read-only).
#
# Collects pending updates, a dist-upgrade simulation for security
# classification, the reboot-required marker, and failed systemd units on
# Debian/Ubuntu hosts. Installs nothing and changes nothing except the apt
# metadata cache refresh (which requires privilege escalation for that one
# task only).
- name: Check for pending updates
  hosts: all
  gather_facts: true
  become: false
  tasks:
    - name: Verify Debian family
      vars:
        nodex_evidence_id: host.os.debian
      ansible.builtin.assert:
        that: ansible_facts['os_family'] == 'Debian'
        fail_msg: "unsupported distribution: only Debian and Ubuntu are supported"

    - name: Refresh package metadata
      vars:
        nodex_evidence_id: host.package.refresh
      ansible.builtin.apt:
        update_cache: true
      become: true
      changed_when: false

    - name: List upgradable packages
      vars:
        nodex_evidence_id: host.packages
      ansible.builtin.command: apt list --upgradable
      register: nodex_upgradable
      changed_when: false

    - name: Simulate dist-upgrade
      vars:
        nodex_evidence_id: host.upgrade_simulation
      ansible.builtin.command: apt-get -s dist-upgrade
      register: nodex_upgrade_simulation
      changed_when: false

    - name: Select security update package names
      ansible.builtin.set_fact:
        nodex_security_package_names: >-
          {{ nodex_upgrade_simulation.stdout_lines
             | select('match', '^Inst ')
             | select('search', '(?i)[(][^)]*(-security|esm)')
             | map('regex_replace', '^Inst ', '')
             | map('regex_replace', ' .*$', '')
             | unique | list }}

    - name: Inspect candidate versions and configured APT sources
      ansible.builtin.command:
        argv:
          - apt-cache
          - policy
          - "{{ item }}"
      loop: "{{ nodex_security_package_names }}"
      register: nodex_security_package_policy
      changed_when: false

    - name: Read signed APT Release origin identities
      ansible.builtin.command:
        argv:
          - apt-get
          - indextargets
          - --format
          - "$(SITE)|$(RELEASE)|$(CODENAME)|$(ORIGIN)|$(LABEL)|$(COMPONENT)|$(ARCHITECTURE)"
      register: nodex_apt_index_targets
      changed_when: false

    - name: Report bounded security package approval evidence
      vars:
        nodex_evidence_id: host.package_policy
      ansible.builtin.debug:
        msg: >-
          {{ {
            'simulation': (nodex_upgrade_simulation.stdout_lines | select('match', '^Inst ') | select('search', '(?i)[(][^)]*(-security|esm)') | list),
            'policies': (nodex_security_package_policy.results | default([])),
            'index_targets': (nodex_apt_index_targets.stdout_lines | default([]))
          } | to_json }}

    - name: Check reboot-required marker
      vars:
        nodex_evidence_id: host.reboot_required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: nodex_reboot_required

    - name: List failed systemd units
      vars:
        nodex_evidence_id: host.failed_units
      ansible.builtin.command: systemctl list-units --state=failed --no-legend --plain
      register: nodex_failed_units
      changed_when: false
      failed_when: false

    - name: Report root filesystem usage
      vars:
        nodex_evidence_id: host.root_usage
      ansible.builtin.command: df -P /
      register: nodex_root_usage
      changed_when: false
