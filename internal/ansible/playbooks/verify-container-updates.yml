---
# Nodex embedded playbook: verify-container-updates.
#
# Verifies the guest remains running, has a usable APT database, and has no
# remaining package or dpkg audit issues. Reboots are never performed.
- name: Verify LXC guest updates
  hosts: all
  gather_facts: false
  become: false
  tasks:
    - name: Verify LXC guest is running
      vars:
        nodex_evidence_id: container.status
      ansible.builtin.command:
        argv:
          - pct
          - status
          - "{{ nodex_vmid }}"
      register: nodex_container_status
      changed_when: false
      failed_when: "nodex_container_status.rc != 0 or 'status: running' not in nodex_container_status.stdout"

    - name: Verify LXC guest uses APT
      vars:
        nodex_evidence_id: container.apt
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ nodex_vmid }}"
          - --
          - test
          - -x
          - /usr/bin/apt-get
      register: nodex_container_apt
      changed_when: false
      failed_when: "nodex_container_apt.rc != 0"

    - name: List remaining LXC upgradable packages
      vars:
        nodex_evidence_id: container.packages
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ nodex_vmid }}"
          - --
          - apt
          - list
          - --upgradable
      register: nodex_container_upgradable
      changed_when: false

    - name: Simulate LXC full upgrade
      vars:
        nodex_evidence_id: container.simulation
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ nodex_vmid }}"
          - --
          - apt-get
          - -s
          - dist-upgrade
      register: nodex_container_upgrade_simulation
      changed_when: false

    - name: Check remaining LXC package database issues
      vars:
        nodex_evidence_id: container.dpkg
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ nodex_vmid }}"
          - --
          - dpkg
          - --audit
      register: nodex_container_dpkg_audit
      changed_when: false
      failed_when: false

    - name: Check LXC reboot-required marker
      vars:
        nodex_evidence_id: container.reboot
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ nodex_vmid }}"
          - --
          - stat
          - -c
          - "%F"
          - /var/run/reboot-required
      register: nodex_container_reboot_required
      changed_when: false
      failed_when: false

    - name: Report LXC root filesystem usage
      vars:
        nodex_evidence_id: container.root
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ nodex_vmid }}"
          - --
          - df
          - -P
          - /
      register: nodex_container_root_usage
      changed_when: false
