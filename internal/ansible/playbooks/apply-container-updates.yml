---
# Nodex embedded playbook: apply-container-updates.
#
# The update policy is fixed to a noninteractive APT dist-upgrade. Reboots are
# deliberately not part of this operation.
- name: Apply LXC guest updates
  hosts: all
  gather_facts: false
  become: false
  tasks:
    - name: Verify LXC guest is running
      vars:
        nodex_evidence_id: container.status
      ansible.builtin.command:
        argv:
          - pct
          - status
          - "{{ nodex_vmid }}"
      register: nodex_container_status
      changed_when: false
      failed_when: "nodex_container_status.rc != 0 or 'status: running' not in nodex_container_status.stdout"

    - name: Verify LXC guest uses APT
      vars:
        nodex_evidence_id: container.apt
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ nodex_vmid }}"
          - --
          - test
          - -x
          - /usr/bin/apt-get
      register: nodex_container_apt
      changed_when: false
      failed_when: "nodex_container_apt.rc != 0"

    - name: Refresh LXC package metadata
      vars:
        nodex_evidence_id: container.refresh
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ nodex_vmid }}"
          - --
          - apt-get
          - update
      register: nodex_container_refresh
      changed_when: false

    - name: Simulate LXC full upgrade
      vars:
        nodex_evidence_id: container.simulation
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ nodex_vmid }}"
          - --
          - apt-get
          - -s
          - dist-upgrade
      register: nodex_container_upgrade_simulation
      changed_when: false

    - name: Apply LXC full upgrade
      vars:
        nodex_evidence_id: container.update
      ansible.builtin.command:
        argv:
          - pct
          - exec
          - "{{ nodex_vmid }}"
          - --
          - env
          - DEBIAN_FRONTEND=noninteractive
          - apt-get
          - -y
          - dist-upgrade
      register: nodex_container_update
      changed_when: true
