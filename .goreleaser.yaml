version: 2

before:
  hooks:
    - go mod verify
    - go mod vendor -o .release-source/vendor

builds:
  - id: nodex
    main: ./cmd/nodex
    binary: nodex
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/geoffmcc/nodex/internal/version.Version={{ .Version }} -X github.com/geoffmcc/nodex/internal/version.Commit={{ .Commit }} -X github.com/geoffmcc/nodex/internal/version.BuildDate={{ .Date }}
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64]
    env:
      - CGO_ENABLED=0

archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_LICENSES.md
      - SOURCE.md
    format_overrides:
      - goos: windows
        formats: [zip]

source:
  enabled: true
  name_template: "nodex_{{ .Version }}_source"
  prefix_template: "nodex_{{ .Version }}_source/"
  format: tar.gz
  files:
    - src: .release-source/vendor/**
      dst: vendor

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: binary
    documents:
      - "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}.spdx.json"
    args:
      - "$artifact"
      - "--select-catalogers"
      - "+go-module-binary-cataloger"
      - "--output"
      - "spdx-json=$document"
      - "--enrich"
      - "all"

signs:
  - artifacts: checksum
    signature: "${artifact}.sigstore.json"
    cmd: cosign
    args:
      - sign-blob
      - --yes
      - --bundle=${signature}
      - ${artifact}

release:
  draft: true
  prerelease: auto
  header: |
    ## Source and licenses

    Download [nodex_{{ .Version }}_source.tar.gz](https://github.com/geoffmcc/nodex/releases/download/{{ .Tag }}/nodex_{{ .Version }}_source.tar.gz)
    for this release's source, vendored dependencies, upstream notices, and build instructions.
    The source archive is covered by the signed checksums.txt manifest.
    Each binary archive includes LICENSE, THIRD_PARTY_LICENSES.md, and SOURCE.md.
