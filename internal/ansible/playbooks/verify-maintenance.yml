---
- name: Verify maintenance postconditions
  hosts: all
  gather_facts: false
  become: false
  tasks:
    - name: Confirm connectivity
      vars:
        nodex_evidence_id: host.connectivity
      ansible.builtin.ping:
    - name: Check reboot-required marker
      vars:
        nodex_evidence_id: host.reboot_required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: nodex_reboot_required
    - name: List failed systemd units
      vars:
        nodex_evidence_id: host.failed_units
      ansible.builtin.command: systemctl list-units --state=failed --no-legend --plain
      changed_when: false
      failed_when: false
    - name: Report root filesystem usage
      vars:
        nodex_evidence_id: host.root_usage
      ansible.builtin.command: df -P /
      changed_when: false
