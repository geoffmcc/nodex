name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.25.13"
      - name: Record Go version
        id: go-version
        run: echo "version=$(go version)" >> "$GITHUB_OUTPUT"
      - name: Install GoReleaser
        run: go install github.com/goreleaser/goreleaser/v2@v2.10.0
      - name: Install Cosign
        run: go install github.com/sigstore/cosign/v2/cmd/cosign@v2.5.0
      - name: Verify modules
        run: go mod verify
      - name: Build release artifacts
        env:
          GOVERSION: ${{ steps.go-version.outputs.version }}
          SOURCE_DATE_EPOCH: 0
        run: goreleaser release --clean
