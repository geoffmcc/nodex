---
- name: Apply approved security updates
  hosts: all
  gather_facts: true
  become: true
  tasks:
    - name: Verify Debian family
      vars:
        nodex_evidence_id: host.os.debian
      ansible.builtin.assert:
        that: ansible_facts['os_family'] == 'Debian'
    - name: Refresh package metadata
      vars:
        nodex_evidence_id: host.package.refresh
      ansible.builtin.apt:
        update_cache: true
    - name: Install security updates
      vars:
        nodex_evidence_id: host.update
      ansible.builtin.apt:
        name: "{{ nodex_packages }}"
        state: latest
        only_upgrade: true
      when: nodex_packages | length > 0
      register: nodex_update_result
    - name: Report update result
      vars:
        nodex_evidence_id: host.update_report
      ansible.builtin.debug:
        msg: "security update operation completed"
