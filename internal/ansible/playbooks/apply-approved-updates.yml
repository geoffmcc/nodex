---
- name: Apply approved full updates
  hosts: all
  gather_facts: true
  become: true
  tasks:
    - name: Verify Debian family
      vars:
        nodex_evidence_id: host.os.debian
      ansible.builtin.assert:
        that: ansible_facts['os_family'] == 'Debian'
    - name: Refresh package metadata
      vars:
        nodex_evidence_id: host.package.refresh
      ansible.builtin.apt:
        update_cache: true
    - name: Install approved full updates
      vars:
        nodex_evidence_id: host.update
      ansible.builtin.apt:
        upgrade: dist
        state: latest
      register: nodex_update_result
    - name: Check for pending updates after installation
      ansible.builtin.command:
        argv:
          - apt
          - list
          - --upgradable
      register: nodex_pending_updates
      changed_when: false
    - name: Verify the approved full update completed
      vars:
        nodex_evidence_id: host.update_verify
      ansible.builtin.assert:
        that:
          - (nodex_pending_updates.stdout_lines | select('search', '/') | list | length) == 0
        fail_msg: "packages remain upgradable after the approved full update"
    - name: Report update result
      vars:
        nodex_evidence_id: host.update_report
      ansible.builtin.debug:
        msg: "full update operation completed"
